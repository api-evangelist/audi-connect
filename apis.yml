aid: audi-connect
name: Audi Connect / myAudi
description: >-
  Audi Connect is the connected-vehicle services platform from Audi AG, the
  Ingolstadt, Germany-based luxury automaker and member of the Volkswagen
  Group. Delivered to drivers through the embedded MMI infotainment system
  and the myAudi companion app for iOS and Android, Audi Connect spans
  remote vehicle control (lock/unlock, remote start, climate pre-conditioning,
  EV charge management), safety and security (Emergency Call/eCall, Audi
  Service Request, stolen-vehicle locator, geofencing, speed alerts), and
  in-car infotainment (real-time traffic, satellite map imagery, parking and
  fuel information, weather, news, natural voice recognition, Amazon Alexa,
  Amazon Music, Wi-Fi hotspot, and an in-vehicle app store with Disney+ and
  passenger gaming on supported models). Services are packaged as Audi
  connect CARE (included for ten years on new U.S. Audis), Audi connect NAV
  (navigation and live traffic), and Audi connect PLUS (premium streaming
  and Wi-Fi). For EVs and PHEVs, Audi Connect adds charging-station search,
  remote charge monitoring, and cabin pre-conditioning. Audi does not
  publish a public developer portal, OpenAPI specification, OAuth program,
  or partner SDK for myAudi/Audi Connect; programmatic access today is
  brokered by third-party connected-car aggregators (Smartcar, High Mobility,
  Enode, Mojio) under Audi's commercial agreements, and community projects
  reverse-engineer the mobile-app endpoints. Audi has publicly discussed an
  internal OpenAPI-driven API management strategy (with Nagarro) but the
  surface remains private to Audi, VW Group brands, and authorized partners.
